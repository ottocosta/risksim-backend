      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
    }

    #intro::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(10,12,18,0.78) 0%,
        rgba(10,12,18,0.65) 50%,
        rgba(10,12,18,0.88) 100%
      );
      z-index: 0;
    }

    #intro > * { position: relative; z-index: 1; }

    .spawn {
      opacity: 0;
      transform: translateY(28px);
      animation: spawnUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes spawnUp {
      to { opacity: 1; transform: translateY(0); }
    }

    /* LIVE BADGE */
    .live-badge-wrap { animation-delay: 0.05s; margin-bottom: 32px; }
    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      border: 1px solid rgba(74,222,128,0.45);
      border-radius: 999px;
      background: rgba(74,222,128,0.08);
      backdrop-filter: blur(6px);
    }
    .live-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 8px #4ade80;
      animation: blink 1.8s ease-in-out infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }
    .live-text {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.2em;
      color: #4ade80;
      text-transform: uppercase;
    }

    /* LOGO */
    .logo-wrap { animation-delay: 0.18s; margin-bottom: 36px; }
    .logo-img {
      height: 54px;
      width: auto;
      display: block;
      filter: drop-shadow(0 0 20px rgba(0,0,0,0.8));
    }

    /* HEADLINE — the catchphrase */
    .headline-wrap { animation-delay: 0.3s; text-align: center; margin-bottom: 20px; }
    h1 {
      font-size: clamp(36px, 5.5vw, 72px);
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.02em;
      color: #ffffff;
      text-shadow: 0 2px 30px rgba(0,0,0,0.6);
    }
    h1 .accent { color: #4ade80; }

    /* MISSION PLACEHOLDER */
    .mission-wrap { animation-delay: 0.42s; text-align: center; max-width: 480px; margin-bottom: 52px; }
    .mission {
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.06em;
      color: rgba(255,255,255,0.35);
      font-style: italic;
      line-height: 1.7;
    }

    /* STATS */
    .stats-wrap {
      animation-delay: 0.52s;
      display: flex;
      gap: 10px;
      margin-bottom: 52px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .stat-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 14px 22px;
      text-align: center;
      min-width: 96px;
      backdrop-filter: blur(8px);
    }
    .stat-num { font-size: 22px; font-weight: 700; color: #fff; letter-spacing: -0.02em; }
    .stat-label {
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.08em;
      color: rgba(255,255,255,0.35);
      text-transform: uppercase;
      margin-top: 4px;
      line-height: 1.5;
    }

    /* BUTTON */
    .enter-wrap { animation-delay: 0.63s; }
    .enter-btn {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 15px 40px;
      background: #ffffff;
      border: 1px solid #ffffff;
      color: #0f1117;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border-radius: 6px;
      transition: background 0.3s, color 0.3s, box-shadow 0.3s;
    }
    .enter-btn:hover {
      background: transparent;
      color: #ffffff;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.5);
    }

    /* KEY HINT */
    .key-hint {
      position: absolute;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.18em;
      color: rgba(255,255,255,0.25);
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
      z-index: 1;
    }
    .key-hint.show { animation: breathe 2.5s ease-in-out infinite; }
    @keyframes breathe {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 0.6; }
    }
    kbd {
      padding: 3px 8px;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 4px;
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      color: rgba(255,255,255,0.35);
      background: rgba(255,255,255,0.04);
    }

    #intro {
      transition: transform 0.8s cubic-bezier(0.65, 0, 0.35, 1),
                  opacity 0.8s cubic-bezier(0.65, 0, 0.35, 1);
    }
    #intro.intro-dismissed {
      transform: translateY(-100vh);
      opacity: 0;
      pointer-events: none;
    }

    /* MAIN SITE */
    #main-site {
      min-height: 100vh;
      background: #0f1117;
      display: flex;
      align-items: center;
      justify-content: center;
      border-top: 1px solid rgba(255,255,255,0.07);
    }
    .placeholder-text {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.25em;
      color: rgba(255,255,255,0.1);
      text-transform: uppercase;
    }
  </style>
</head>
<body>

<section id="intro">

  <div class="live-badge-wrap spawn">
    <div class="live-badge">
      <div class="live-dot"></div>
      <span class="live-text">Live Intelligence</span>
    </div>

<script>
  setTimeout(() => {
    document.getElementById('keyHint').classList.add('show');
  }, 1800);

  let introDismissed = false;

  function handleEnterKey(e) {
    if (e.key === 'Enter' && !introDismissed) {
      e.preventDefault();
      enterSite();
    }
  }

  function enterSite() {
    if (introDismissed) return;
    introDismissed = true;
    document.removeEventListener('keydown', handleEnterKey);
    const intro = document.getElementById('intro');
    intro.classList.add('intro-dismissed');
    intro.addEventListener('transitionend', function handler() {
      intro.style.display = 'none';
      intro.removeEventListener('transitionend', handler);
    });
  }

  document.addEventListener('keydown', handleEnterKey);
