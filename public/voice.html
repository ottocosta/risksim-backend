<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>RiskSim Voice</title></head>
<body>
<script>
var recognition=null;
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;

window.addEventListener('message',function(e){
  if(!e.data||!e.data.type)return;
  
  if(e.data.type==='risksim-voice-start'){
    if(!SR){window.parent.postMessage({type:'risksim-voice-error',error:'not-supported'},'*');return;}
    if(recognition){try{recognition.stop();}catch(x){}}
    recognition=new SR();
    recognition.continuous=false;
    recognition.interimResults=true;
    recognition.lang='en-US';
    recognition.onresult=function(ev){
      var t='';for(var i=ev.resultIndex;i<ev.results.length;i++)t+=ev.results[i][0].transcript;
      if(ev.results[ev.resultIndex].isFinal){
        window.parent.postMessage({type:'risksim-voice-result',transcript:t.trim()},'*');
      }else{
        window.parent.postMessage({type:'risksim-voice-interim',transcript:t},'*');
      }
    };
    recognition.onerror=function(ev){
      window.parent.postMessage({type:'risksim-voice-error',error:ev.error},'*');
    };
    recognition.onend=function(){
      window.parent.postMessage({type:'risksim-voice-ended'},'*');
    };
    recognition.start();
    window.parent.postMessage({type:'risksim-voice-started'},'*');
  }
  
  if(e.data.type==='risksim-voice-stop'){
    if(recognition){try{recognition.stop();}catch(x){}}
  }
});

window.parent.postMessage({type:'risksim-voice-ready'},'*');
</script>
</body>
</html>
