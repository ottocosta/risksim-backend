<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>RiskSim Voice</title></head>
<body>
<script>
var recognition=null;
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
var _continuous=false;
var _parentOrigin=null;

function replyToParent(msg){
  window.parent.postMessage(msg,_parentOrigin||'*');
}

window.addEventListener('message',function(e){
  if(!e.data||!e.data.type)return;
  
  if(e.data.type==='risksim-voice-start'){
    _parentOrigin=e.origin;
    if(!SR){replyToParent({type:'risksim-voice-error',error:'not-supported'});return;}
    _continuous=(e.data.mode==='continuous');
    if(recognition){try{recognition.stop();}catch(x){}}
    recognition=new SR();
    recognition.continuous=_continuous;
    recognition.interimResults=true;
    recognition.lang='en-US';
    recognition.onresult=function(ev){
      var t='';for(var i=ev.resultIndex;i<ev.results.length;i++)t+=ev.results[i][0].transcript;
      if(ev.results[ev.resultIndex].isFinal){
        replyToParent({type:'risksim-voice-result',transcript:t.trim()});
      }else{
        replyToParent({type:'risksim-voice-interim',transcript:t});
      }
    };
    recognition.onerror=function(ev){
      replyToParent({type:'risksim-voice-error',error:ev.error});
    };
    recognition.onend=function(){
      if(_continuous){
        try{recognition.start();}catch(x){}
      }else{
        replyToParent({type:'risksim-voice-ended'});
      }
    };
    recognition.start();
    replyToParent({type:'risksim-voice-started'});
  }
  
  if(e.data.type==='risksim-voice-stop'){
    _continuous=false;
    if(recognition){try{recognition.stop();}catch(x){}}
  }
});

window.parent.postMessage({type:'risksim-voice-ready'},'*');
</script>
</body>
</html>
