<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>RiskSim — Supply Chain Intelligence</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">

  <!-- Leaflet CSS (v1.9.4) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    /* ===== CSS VARIABLES ===== */
    :root {
      --bg:       #0a0a0a;
      --surface:  rgba(10,10,10,0.95);
      --border:   rgba(255,255,255,0.08);
      --text:     #e0e0e0;
      --muted:    #888;
      --accent:   #7DF9C2;
      --font:     'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono:'JetBrains Mono', monospace;
    }

    /* ===== RESET ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    /* ===== MAP CONTAINER (fullscreen, behind all UI) ===== */
    #mapContainer {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    #map {
      position: absolute;
      inset: 0;
    }

    /* ===== LOADING SKELETON ===== */
    #mapSkeleton {
      position: fixed;
      inset: 0;
      z-index: 1;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #mapSkeleton::after {
      content: 'Loading map…';
      color: var(--muted);
      font-size: 13px;
      font-family: var(--font-mono);
      letter-spacing: 0.5px;
    }
    .skeleton-shimmer {
      position: absolute;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg,
        rgba(255,255,255,0) 0%,
        rgba(255,255,255,0.03) 50%,
        rgba(255,255,255,0) 100%);
      animation: shimmer 1.8s ease-in-out infinite;
    }
    @keyframes shimmer {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    /* ===== LEAFLET OVERRIDES (dark theme) ===== */
    .leaflet-popup-content-wrapper {
      background: rgba(10,10,10,0.98) !important;
      color: #fff !important;
      border-radius: 10px !important;
      border: 1px solid rgba(255,255,255,0.12) !important;
      box-shadow: 0 8px 32px rgba(0,0,0,0.8) !important;
    }
    .leaflet-popup-tip  { background: rgba(10,10,10,0.98) !important; }
    .leaflet-popup-content { margin: 0 !important; }
    .leaflet-control-attribution {
      background: rgba(0,0,0,0.7) !important;
      color: #444 !important;
      font-size: 9px !important;
    }
    .leaflet-control-attribution a { color: #444 !important; }

    /* ===== MAP OVERLAY HEADER ===== */
    .map-overlay-header {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 100;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      pointer-events: none;
    }
    .map-layer-name {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
    }
    .map-layer-sub {
      font-size: 10px;
      color: var(--muted);
      margin-top: 2px;
    }

    /* ===== LAYER TOGGLE CONTROLS ===== */
    .layer-controls {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      gap: 4px;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px;
    }
    .layer-btn {
      font-family: var(--font);
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      background: transparent;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .layer-btn:hover { color: #ccc; background: rgba(255,255,255,0.06); }
    .layer-btn.active {
      color: #fff;
      background: rgba(255,255,255,0.12);
    }

    /* ===== MAP LEGEND ===== */
    .map-legend {
      position: fixed;
      bottom: 32px;
      left: 16px;
      z-index: 100;
      background: rgba(8,8,8,0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 4px;
      padding: 14px 16px;
    }
    .legend-title {
      font-size: 9px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 8px;
      font-family: var(--font-mono);
    }
    .legend-items {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 10px;
      color: var(--muted);
      font-family: var(--font-mono);
    }
    .legend-swatch {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ===== MAP MARKERS ===== */
    .map-marker { position: relative; }
    .marker-dot {
      border-radius: 50%;
      position: absolute;
      top: 0;
      left: 0;
    }
    .marker-pulse {
      position: absolute;
      border-radius: 50%;
      animation: marker-pulse 2s ease-out infinite;
      opacity: 0;
      top: 0;
      left: 0;
    }
    @keyframes marker-pulse {
      0%   { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(2.5); opacity: 0; }
    }

    /* ===== POPUP STYLES ===== */
    .popup-inner    { padding: 12px 14px; min-width: 230px; }
    .popup-header   { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .popup-country  { font-size: 14px; font-weight: 700; color: #fff; }
    .popup-risk-badge {
      font-size: 10px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 12px;
    }
    .popup-row {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      font-size: 11px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .popup-label { color: var(--muted); }
    .popup-value { color: #fff; font-weight: 500; }
    .popup-insight {
      margin-top: 10px;
      font-size: 10px;
      color: var(--muted);
      line-height: 1.5;
      font-style: italic;
    }
  </style>
</head>

<!-- Legend -->
<div class="map-legend">

  <div class="legend-items" id="legendItems"></div>
</div>

// ============================================================
// COLOR & SCORE HELPERS
// ============================================================
function getRiskColor(score) {
  if (score >= 80) return '#ff0040';
  if (score >= 60) return '#ff8c00';
  if (score >= 45) return '#f5c518';
  if (score >= 30) return '#8bc34a';
  if (score >= 15) return '#00e676';
  return '#00bcd4';
}

function getSourcingColor(score) {
  if (score >= 80) return '#00bcd4';
  if (score >= 60) return '#00e676';
  if (score >= 40) return '#8bc34a';
  if (score >= 20) return '#f5c518';
  if (score >= 10) return '#ff8c00';
  return '#ff0040';
}

function getRiskLabel(score) {
  if (score >= 80) return 'CRITICAL';
  if (score >= 60) return 'HIGH';
  if (score >= 45) return 'MEDIUM-HIGH';
  if (score >= 30) return 'MEDIUM';
  if (score >= 15) return 'LOW-MEDIUM';
  return 'LOW';
}

function getScoreForLayer(country, layer) {
  if (layer === 'shipping') return country.shipping * 10;
  if (layer === 'labor')    return country.labor * 10;
  if (layer === 'cost')     return country.costIndex;
  if (layer === 'sourcing') {
    var s = country.sourcing;
    return s ? (s[currentCategory] || 0) : 0;
  }
  return country.risk;
}

function getColorForLayer(score, layer) {
  if (layer === 'sourcing') return getSourcingColor(score);
  return getRiskColor(score);
}

function getCountryDotSize(name) {
  var tier1 = ['China', 'United States', 'Germany', 'Japan', 'South Korea'];
  var tier2 = ['France', 'Italy', 'United Kingdom', 'Netherlands', 'Canada', 'Mexico',
               'India', 'Vietnam', 'Taiwan', 'Singapore', 'Brazil', 'Russia'];
  if (tier1.indexOf(name) !== -1) return 8;
  if (tier2.indexOf(name) !== -1) return 6;
  return 5;
}
