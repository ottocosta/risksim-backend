<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>RiskSim — Supply Chain Intelligence</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">

  <!-- Leaflet CSS (v1.9.4) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    /* ===== CSS VARIABLES ===== */
    :root {
      --bg:         #07080d;
      --surface:    rgba(12,14,22,0.82);
      --surface2:   rgba(15,18,28,0.9);
      --border:     rgba(255,255,255,0.07);
      --border-glow:rgba(125,249,194,0.15);
      --text:       #e2e8f0;
      --muted:      #64748b;
      --accent:     #7DF9C2;
      --accent2:    #4ade80;
      --danger:     #ff3355;
      --warning:    #ff8c00;
      --font:       'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono:  'JetBrains Mono', monospace;
      --glass-bg:   rgba(10,12,22,0.6);
      --glass-border:rgba(125,249,194,0.12);
      --glass-shadow:0 8px 32px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.04);
      --radius:     12px;
      --radius-sm:  8px;
    }

    /* ===== RESET ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    /* ===== MAP CONTAINER (fullscreen, behind all UI) ===== */
    #mapContainer {
      position: fixed;
      inset: 0;
      z-index: 0;
    }
    #map {
      position: absolute;
      inset: 0;
    }

    /* ===== ENTRANCE ANIMATIONS ===== */
    @keyframes slideUpFade {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes shimmer {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
    @keyframes shimmerPulse {
      0%, 100% { opacity: 0.4; }
      50%       { opacity: 0.8; }
    }
    @keyframes skeletonPulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.5; }
    }
    @keyframes marker-pulse {
      0%   { transform: scale(1);   opacity: 0.75; }
      100% { transform: scale(2.8); opacity: 0; }
    }
    @keyframes markerGlow {
      0%, 100% { filter: brightness(1); }
      50%       { filter: brightness(1.4) drop-shadow(0 0 4px currentColor); }
    }
    @keyframes legendItemIn {
      from { opacity: 0; transform: translateX(-10px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    @keyframes ripple {
      0%   { transform: scale(0); opacity: 0.5; }
      100% { transform: scale(2.5); opacity: 0; }
    }
    @keyframes panelIn {
      from { opacity: 0; transform: translateY(-12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes glowPulse {
      0%, 100% { box-shadow: var(--glass-shadow); }
      50%       { box-shadow: var(--glass-shadow), 0 0 20px rgba(125,249,194,0.08); }
    }

    /* ===== LOADING SKELETON ===== */
    #mapSkeleton {
      position: fixed;
      inset: 0;
      z-index: 1;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      animation: fadeIn 0.3s ease;
    }
    .skeleton-logo {
      font-family: var(--font-mono);
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: var(--accent);
      text-transform: uppercase;
      animation: shimmerPulse 1.8s ease-in-out infinite;
    }
    .skeleton-sub {
      font-size: 11px;
      color: var(--muted);
      font-family: var(--font-mono);
      letter-spacing: 0.08em;
      animation: shimmerPulse 1.8s ease-in-out 0.3s infinite;
    }
    .skeleton-bar {
      width: 120px;
      height: 2px;
      background: rgba(125,249,194,0.15);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 4px;
    }
    .skeleton-bar::after {
      content: '';
      display: block;
      height: 100%;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      animation: shimmer 1.4s ease-in-out infinite;
    }
    .skeleton-shimmer {
      position: absolute;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg,
        rgba(255,255,255,0) 0%,
        rgba(125,249,194,0.03) 50%,
        rgba(255,255,255,0) 100%);
      animation: shimmer 2.2s ease-in-out infinite;
    }

    /* ===== LEAFLET OVERRIDES (dark theme) ===== */
    .leaflet-popup-content-wrapper {
      background: rgba(8,10,18,0.96) !important;
      color: #fff !important;
      border-radius: 14px !important;
      border: 1px solid rgba(125,249,194,0.18) !important;
      border-left: 3px solid var(--accent) !important;
      box-shadow: 0 16px 48px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.04) !important;
      backdrop-filter: blur(20px) !important;
      -webkit-backdrop-filter: blur(20px) !important;
    }
    .leaflet-popup-tip-container { display: none !important; }
    .leaflet-popup-content { margin: 0 !important; }
    .leaflet-popup-close-button {
      color: var(--muted) !important;
      top: 10px !important;
      right: 10px !important;
      font-size: 16px !important;
      width: 20px !important;
      height: 20px !important;
      line-height: 20px !important;
    }
    .leaflet-popup-close-button:hover { color: var(--text) !important; }
    .leaflet-control-attribution {
      background: rgba(0,0,0,0.5) !important;
      color: #333 !important;
      font-size: 9px !important;
      backdrop-filter: blur(8px);
    }
    .leaflet-control-attribution a { color: #444 !important; }

    /* ===== MAP OVERLAY HEADER ===== */
    .map-overlay-header {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 100;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      padding: 12px 16px;
      pointer-events: none;
      box-shadow: var(--glass-shadow);
      animation: panelIn 0.5s cubic-bezier(0.16,1,0.3,1) 0.2s both;
      min-width: 160px;
    }
    .map-overlay-header::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: var(--radius);
      background: linear-gradient(135deg, rgba(125,249,194,0.04) 0%, transparent 60%);
      pointer-events: none;
    }
    .map-layer-name {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      letter-spacing: 0.01em;
    }
    .map-layer-sub {
      font-size: 10px;
      color: var(--muted);
      margin-top: 3px;
      letter-spacing: 0.02em;
      line-height: 1.4;
      max-width: 200px;
    }
    .header-accent {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      margin-right: 6px;
      box-shadow: 0 0 6px var(--accent);
      vertical-align: middle;
      position: relative;
      top: -1px;
    }

    /* ===== LAYER TOGGLE CONTROLS ===== */
    .layer-controls {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      gap: 2px;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      padding: 4px;
      box-shadow: var(--glass-shadow);
      animation: panelIn 0.5s cubic-bezier(0.16,1,0.3,1) 0.3s both;
      overflow: hidden;
    }
    .layer-controls::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(125,249,194,0.03) 0%, transparent 50%);
      pointer-events: none;
    }
    .layer-btn {
      position: relative;
      font-family: var(--font);
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      background: transparent;
      border: none;
      padding: 7px 14px;
      border-radius: 7px;
      cursor: pointer;
      transition: color 0.2s, background 0.2s, transform 0.2s, box-shadow 0.2s;
      letter-spacing: 0.02em;
      overflow: hidden;
      white-space: nowrap;
    }
    .layer-btn::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 2px;
      background: var(--accent);
      border-radius: 2px;
      transition: width 0.25s ease;
      box-shadow: 0 0 8px var(--accent);
    }
    .layer-btn:hover {
      color: #cbd5e1;
      background: rgba(255,255,255,0.06);
      transform: translateY(-1px);
    }
    .layer-btn.active {
      color: #fff;
      background: rgba(125,249,194,0.1);
    }
    .layer-btn.active::after {
      width: calc(100% - 16px);
    }
    .layer-btn:active { transform: translateY(0); }
    .ripple-effect {
      position: absolute;
      border-radius: 50%;
      background: rgba(125,249,194,0.25);
      width: 60px;
      height: 60px;
      margin-top: -30px;
      margin-left: -30px;
      pointer-events: none;
      animation: ripple 0.5s ease-out forwards;
    }

    /* ===== MAP LEGEND ===== */
    .map-legend {
      position: fixed;
      bottom: 32px;
      left: 16px;
      z-index: 100;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-left: 2px solid var(--accent);
      border-radius: var(--radius);
      padding: 14px 16px;
      box-shadow: var(--glass-shadow);
      animation: panelIn 0.5s cubic-bezier(0.16,1,0.3,1) 0.4s both;
      min-width: 170px;
    }
    .map-legend::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(125,249,194,0.04) 0%, transparent 50%);
      pointer-events: none;
    }
    .legend-title {
      font-size: 9px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 10px;
      font-family: var(--font-mono);
    }
    .legend-items {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 10px;
      color: #94a3b8;
      font-family: var(--font-mono);
      letter-spacing: 0.01em;
      opacity: 0;
      animation: legendItemIn 0.3s ease forwards;
    }
    .legend-swatch {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 4px currentColor;
    }

    /* ===== MAP MARKERS ===== */
    .map-marker { position: relative; }
    .marker-dot {
      border-radius: 50%;
      position: absolute;
      top: 0;
      left: 0;
      box-shadow: 0 0 6px currentColor;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .marker-pulse {
      position: absolute;
      border-radius: 50%;
      animation: marker-pulse 2.2s ease-out infinite;
      opacity: 0;
      top: 0;
      left: 0;
    }

    /* ===== POPUP STYLES ===== */
    .popup-inner    { padding: 14px 16px; min-width: 240px; }
    .popup-header   { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .popup-country  { font-size: 15px; font-weight: 700; color: #fff; letter-spacing: -0.01em; }
    .popup-risk-badge {
      font-size: 9px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 20px;
      letter-spacing: 0.08em;
      font-family: var(--font-mono);
    }
    .popup-divider {
      height: 1px;
      background: linear-gradient(90deg, rgba(125,249,194,0.2), transparent);
      margin-bottom: 10px;
    }
    .popup-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 0;
      font-size: 11px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .popup-row:last-of-type { border-bottom: none; }
    .popup-label { color: var(--muted); letter-spacing: 0.02em; }
    .popup-value {
      color: #fff;
      font-weight: 600;
      font-family: var(--font-mono);
      font-size: 10px;
    }
    .popup-insight {
      margin-top: 12px;
      font-size: 10px;
      color: #64748b;
      line-height: 1.6;
      font-style: italic;
      padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,0.05);
    }
    .popup-score-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
    }
    .popup-bar-track {
      flex: 1;
      height: 3px;
      background: rgba(255,255,255,0.08);
      border-radius: 3px;
      overflow: hidden;
    }
    .popup-bar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.4s ease;
    }
    .popup-bar-label {
      font-size: 9px;
      font-family: var(--font-mono);
      color: var(--muted);
      width: 26px;
      text-align: right;
    }

    /* ===== INTRO OVERLAY ===== */
    #introOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 9999;
      background-color: #0a0c12;
      background-size: cover;
    }
  </style>
</head>

  document.documentElement.scrollTop = 0;
  document.body.scrollTop = 0;
</script>
<script>document.body.style.overflow = 'hidden';</script>
<div id="introOverlay"></div>

<script>
(function() {
  var dismissed = false;
  var overlay = document.getElementById('introOverlay');

  function dismiss() {
    if (dismissed) return;
    dismissed = true;
    if (!overlay) return;
    overlay.style.transition = 'opacity 0.5s ease';
    overlay.style.opacity = '0';
    overlay.style.pointerEvents = 'none';
    document.removeEventListener('keydown', onKey);
    setTimeout(function() {
      window.scrollTo(0, 0);
      document.documentElement.scrollTop = 0;
      document.body.scrollTop = 0;
      document.body.style.overflow = '';
      if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
    }, 520);
  }

  // 1. postMessage from Shopify parent
  window.addEventListener('message', function(e) {
    if (e.data === 'risksim-enter') dismiss();
  });

  // 2. Auto-dismiss after 3 seconds
  setTimeout(dismiss, 3000);

  // 3. Click / tap on the overlay
  if (overlay) overlay.addEventListener('click', dismiss);

  // 4. Keyboard: Enter, Space, or Escape
  function onKey(e) {
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar' || e.key === 'Escape') {
      e.preventDefault();
      dismiss();
    }
  }
  document.addEventListener('keydown', onKey);
})();
</script>

// ============================================================
// COLOR & SCORE HELPERS
// ============================================================
function getRiskColor(score) {
  if (score >= 80) return '#ff1a4a';
  if (score >= 60) return '#ff8c00';
  if (score >= 45) return '#f5c518';
  if (score >= 30) return '#8bc34a';
  if (score >= 15) return '#00e676';
  return '#00e5ff';
}

function getSourcingColor(score) {
  if (score >= 80) return '#00e5ff';
  if (score >= 60) return '#00e676';
  if (score >= 40) return '#8bc34a';
  if (score >= 20) return '#f5c518';
  if (score >= 10) return '#ff8c00';
  return '#ff1a4a';
}

function getRiskLabel(score) {
  if (score >= 80) return 'CRITICAL';
  if (score >= 60) return 'HIGH';
  if (score >= 45) return 'MED-HIGH';
  if (score >= 30) return 'MEDIUM';
  if (score >= 15) return 'LOW-MED';
  return 'LOW';
}

function getScoreForLayer(country, layer) {
  if (layer === 'shipping') return country.shipping * 10;
  if (layer === 'labor')    return country.labor * 10;
  if (layer === 'cost')     return country.costIndex;
  if (layer === 'sourcing') {
    var s = country.sourcing;
    return s ? (s[currentCategory] || 0) : 0;
  }
  return country.risk;
}

function getColorForLayer(score, layer) {
  if (layer === 'sourcing') return getSourcingColor(score);
  return getRiskColor(score);
}

function getCountryDotSize(name) {
  var tier1 = ['China', 'United States', 'Germany', 'Japan', 'South Korea'];
  var tier2 = ['France', 'Italy', 'United Kingdom', 'Netherlands', 'Canada', 'Mexico',
               'India', 'Vietnam', 'Taiwan', 'Singapore', 'Brazil', 'Russia'];
  if (tier1.indexOf(name) !== -1) return 9; // tier-1: slightly larger for key global hubs
  if (tier2.indexOf(name) !== -1) return 7; // tier-2: medium for major sourcing nations
  return 5; // default size for remaining countries
}

  });

  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/">CARTO</a>',
    subdomains: 'abcd',
    maxZoom: 19
  }).addTo(map);

  L.control.zoom({ position: 'bottomright' }).addTo(map);

  map.on('load', function() {
    var skeleton = document.getElementById('mapSkeleton');
    if (skeleton) skeleton.style.display = 'none';
  });

  renderMarkers();
  buildLegend(currentLayer);
}

// ============================================================
// MARKER RENDERING
// ============================================================
function renderMarkers() {
  for (var key in countryMarkers) {
    countryMarkers[key].remove();
  }
  countryMarkers = {};

  for (var i = 0; i < COUNTRY_DATA.length; i++) {
    (function(country) {
      var score = getScoreForLayer(country, currentLayer);
      var color = getColorForLayer(score, currentLayer);
      var size  = getCountryDotSize(country.name);

      var icon = L.divIcon({
        className: '',
        html: '<div class="map-marker" style="width:' + (size*2) + 'px;height:' + (size*2) + 'px;">' +
                '<div class="marker-dot" style="width:' + (size*2) + 'px;height:' + (size*2) + 'px;background:' + color + ';color:' + color + ';"></div>' +
                '<div class="marker-pulse" style="width:' + (size*2) + 'px;height:' + (size*2) + 'px;border:2px solid ' + color + ';animation-duration:' + (1.8 + (country.name.length % 5) * 0.2) + 's;"></div>' +
              '</div>',
        iconSize:   [size*2, size*2],
        iconAnchor: [size,   size]
      });

      var marker = L.marker([country.lat, country.lng], { icon: icon });

      marker.bindPopup(buildCountryPopupHTML(country), {
        maxWidth: 290,
        minWidth: 250,
        className: 'custom-popup'
      });

      marker.addTo(map);
      countryMarkers[country.name] = marker;
    })(COUNTRY_DATA[i]);
  }
}

// ============================================================
// LEGEND BUILDER
// ============================================================
function buildLegend(layer) {
  var config = LAYER_CONFIG[layer];
  if (!config) return;

  var titleEl = document.getElementById('legendTitle');
  var itemsEl = document.getElementById('legendItems');
  if (!titleEl || !itemsEl) return;

  titleEl.textContent = config.legendTitle;
  itemsEl.innerHTML = '';

  for (var i = 0; i < config.items.length; i++) {
    (function(item, idx) {
      var div = document.createElement('div');
      div.className = 'legend-item';
      div.style.animationDelay = (idx * LEGEND_STAGGER_DELAY) + 's';
      div.innerHTML =
        '<div class="legend-swatch" style="background:' + item.color + ';box-shadow:0 0 5px ' + item.color + '88;"></div>' +
        '<span>' + item.label + '</span>';
      itemsEl.appendChild(div);
    })(config.items[i], i);
  }
}

var LEGEND_STAGGER_DELAY = 0.05; // seconds between each legend item fade-in
function updateMapLayer(layer) {
  currentLayer = layer;

  // Update button states
  var btnMap = { risk:'btnRisk', shipping:'btnShipping', labor:'btnLabor', cost:'btnCost', sourcing:'btnSourcing' };
  for (var k in btnMap) {
    var btn = document.getElementById(btnMap[k]);
    if (btn) {
      btn.classList.toggle('active', k === layer);
    }
  }

  // Ripple effect on clicked button
  var activeBtn = document.getElementById(btnMap[layer]);
  if (activeBtn) {
    var ripple = document.createElement('span');
    ripple.className = 'ripple-effect';
    var rect = activeBtn.getBoundingClientRect();
    ripple.style.left = (rect.width / 2) + 'px';
    ripple.style.top  = (rect.height / 2) + 'px';
    activeBtn.appendChild(ripple);
    setTimeout(function() { if (ripple.parentNode) ripple.parentNode.removeChild(ripple); }, 600);
  }

  // Update overlay header
  var config = LAYER_CONFIG[layer];
  if (config) {
    var nameEl = document.getElementById('overlayName');
    var subEl  = document.getElementById('overlaySub');
    if (nameEl) nameEl.textContent = config.name;
    if (subEl)  subEl.textContent  = config.sub;
  }

  // Re-render markers and legend
  renderMarkers();
  buildLegend(layer);
}

// ============================================================
// BOOTSTRAP
// ============================================================
document.addEventListener('DOMContentLoaded', function() {
  initMap();

  // Hide skeleton once map tiles start loading
  setTimeout(function() {
    var skeleton = document.getElementById('mapSkeleton');
    if (skeleton) {
      skeleton.style.transition = 'opacity 0.5s ease';
      skeleton.style.opacity = '0';
      setTimeout(function() {
        if (skeleton.parentNode) skeleton.style.display = 'none';
      }, 500);
    }
  }, 1200);
});
</script>
